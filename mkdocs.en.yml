site_name: mapelements
site_description: Vector scale bars, north arrows and graticules for matplotlib
site_author: zhangbo
site_url: https://sanpi0205.github.io/mapelements/en/
docs_dir: docs/en
site_dir: site/en
use_directory_urls: true
hooks:
  - docs/hooks.py

theme:
  name: mkdocs
  locale: en
  highlightjs: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Map elements: elements.md
  - Projections: projections.md
  - Layout and typography: layout.md
  - Exporting for a journal: export.md
  - API reference: api.md
  - Cookbook: cookbook.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - fenced_code
  - toc:
      permalink: true
      toc_depth: 3
