name: Attach release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download the published files from PyPI
        run: |
          version="${TAG#v}"
          mkdir -p dist
          python -m pip install --upgrade pip
          python -m pip download --no-deps --only-binary=:all: \
            --dest dist "mapelements==${version}"
          python -m pip download --no-deps --no-binary=:all: \
            --dest dist "mapelements==${version}"
          cd dist
          sha256sum * > SHA256SUMS
          ls -l
      - name: Upload to the GitHub Release
        run: gh release upload "$TAG" dist/* --clobber
