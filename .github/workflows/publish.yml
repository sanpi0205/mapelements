name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only (select a v* tag when running manually)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: pytest -q

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require a version tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Run this workflow from a v* tag, not $GITHUB_REF"; exit 1 ;;
          esac
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf dist
          python -m build
          twine check --strict dist/*
      - name: Verify tag matches built version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys

          version = os.environ["TAG"].removeprefix("v")
          files = [p.name for p in pathlib.Path("dist").iterdir()]
          if not files:
              sys.exit("dist/ is empty")
          if not all(version in name for name in files):
              sys.exit(f"tag {version!r} does not match built files: {files}")
          print("version:", version)
          print("files:", files)
          PY
      - name: Smoke-test wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import importlib.resources as resources
          import os

          import mapelements

          assert mapelements.__version__ == os.environ["TAG"].removeprefix("v")
          assert resources.files("mapelements").joinpath("py.typed").is_file()
          print("mapelements", mapelements.__version__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: upload to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.dry_run != true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mapelements
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  assets:
    name: attach artifacts to the release
    needs: [build, publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
