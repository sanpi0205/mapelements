name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.en.yml"
      - "mkdocs.zh.yml"
      - "check_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install docs tools
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.5" "markdown>=3.5"
      - name: Check links and code blocks
        run: python check_docs.py
      - name: Build English
        run: mkdocs build -f mkdocs.en.yml -d site/en
      - name: Build Chinese
        run: mkdocs build -f mkdocs.zh.yml -d site/zh
      - name: Landing page
        run: cp docs/landing.html site/index.html && touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
